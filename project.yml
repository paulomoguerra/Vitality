name: Vitality
options:
  bundleIdPrefix: com.paulomateus
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM lives in Local.xcconfig (gitignored) so the repo carries no
# machine-specific signing identity. Copy Local.xcconfig.example to get started.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Vitality:
    type: application
    platform: macOS
    sources:
      - path: VitalityShared
      - path: Vitality
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulomateus.vitality
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Vitality/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Vitality
        NSHumanReadableCopyright: ""
        # Read at runtime so no team ID is hardcoded in source. See AppGroup.id.
        VitalityAppGroup: $(DEVELOPMENT_TEAM).group.com.paulomateus.vitality
    entitlements:
      path: Vitality/Vitality.entitlements
      properties:
        # macOS requires App Group identifiers to be prefixed with the team ID.
        # The bare "group.*" form is the iOS convention; on macOS group
        # containers are TCC-protected and containermanagerd rejects any
        # requestor whose signature doesn't match the prefix.
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).group.com.paulomateus.vitality
    dependencies:
      - target: VitalityWidget
        embed: true

  # No test host. Vitality is an LSUIElement menu bar app, and hosting the tests
  # inside it means launching a status item and a 1 Hz poller to exercise a hash
  # function. The units under test are pure, so the bundle compiles them
  # directly — which is also why this list is explicit: it states what is being
  # tested rather than pulling in the whole app.
  VitalityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VitalityTests
      - path: Vitality/DuplicateAnalyzer.swift
      - path: Vitality/HealthScore.swift
      - path: Vitality/ActionError.swift
      - path: VitalityShared/SystemStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulomateus.vitality.tests
        # A test bundle has nothing to declare, so let the toolchain synthesise
        # the plist rather than checking an empty one into the repo.
        GENERATE_INFOPLIST_FILE: "YES"

  VitalityWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: VitalityShared
      - path: VitalityWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulomateus.vitality.widget
    info:
      path: VitalityWidget/Info.plist
      properties:
        CFBundleDisplayName: Vitality Widgets
        VitalityAppGroup: $(DEVELOPMENT_TEAM).group.com.paulomateus.vitality
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VitalityWidget/VitalityWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).group.com.paulomateus.vitality

schemes:
  Vitality:
    build:
      targets:
        Vitality: all
        VitalityTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VitalityTests
